

[platformio]
data_dir    = rootfs/
build_dir   = build/
libdeps_dir = build/libs


[env:esp32dev]
platform               = espressif32
framework              = espidf
board                  = esp32dev
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed          = 115200
extra_scripts          = tools/custom.py

lib_compat_mode = off
lib_ldf_mode    = deep

build_flags = 
	-Ibuild/
	-DDEBUG
	-DBUILDING_LIBCURL
	-DHAVE_CONFIG_H
	-DHAVE_BASENAME
	-Wno-override-init
	-Wno-format
	-Dasm=__asm
	-std=c2x


[extern]
libcurl = 8.13.0
libssh2 = 1.11.1
libyxml = master



[autodoc]
template = autodoc.h.j2
exts     = c;cpp;h;hpp;asm;rs;py;sh
sources  = src/
output   = build/autodoc.h



[codec]
group     = 7
undefined = 255
unify     = true
output    = build/pagetables.h
codepages =
	cp437       cp500       cp737 
	cp850       cp852       cp855
	iso-8859-1  iso-8859-2  iso-8859-3  iso-8859-4
	iso-8859-5  iso-8859-6  iso-8859-7  iso-8859-8
	iso-8859-9  iso-8859-10 iso-8859-11 iso-8859-13
	iso-8859-14 iso-8859-15 iso-8859-16
	cp1250      cp1251      cp1252      cp1253
	macgreek


